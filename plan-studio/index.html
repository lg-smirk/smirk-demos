152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Smirk — shared base\n   Global resets and typographic rules only. No component or layout styling:\n   everything else stays inline on the element.\n   Link from a page's <helmet>:  <link rel=\"stylesheet\" href=\"./smirk-base.css\">\n   ========================================================================== */\n\n/* --- Reset ---------------------------------------------------------------- */\n*{box-sizing:border-box}\nhtml{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}\nbody{\n  margin:0;\n  background:#FDFCFB;\n  color:#163137;\n  font-family:\"Schibsted Grotesk\",Helvetica,Arial,sans-serif;\n}\nimg,svg,video{max-width:100%}\nsub,sup{line-height:0}\n\n/* --- Links ---------------------------------------------------------------- */\na{color:#26525C;text-decoration:none}\na:hover{color:#35707E}\n\n/* --- Copy quality --------------------------------------------------------- */\n/* pretty is inherited, so every text node on the page is orphan-protected */\nbody{\n  text-wrap:pretty;\n  hanging-punctuation:first allow-end last;\n  font-kerning:normal;\n  font-variant-numeric:proportional-nums;\n  font-optical-sizing:auto;\n  font-feature-settings:\"kern\" 1,\"liga\" 1,\"calt\" 1;\n}\n/* Display type: heading tags, plus the div/a-based titles this system uses,\n   identified by their tight display letter-spacing. The runtime re-serializes\n   inline styles with a space after the colon, so both forms are matched. */\nh1,h2,h3,h4,h5,h6,summary,\n[style*=\"letter-spacing: -0.0\"]:not(p,li,blockquote,dd),\n[style*=\"letter-spacing:-0.0\"]:not(p,li,blockquote,dd){text-wrap:balance}\n/* balance equalises line lengths, which is right for a headline and wrong for a\n   sentence — it leaves short ragged lines and unused room at the right edge */\np,li,blockquote,dd{text-wrap:pretty}\np,li,blockquote,dd{orphans:3;widows:3}\nh1,h2,h3,h4,h5,h6,blockquote,figure{break-inside:avoid;break-after:avoid-page}\n\n/* --- Interaction ---------------------------------------------------------- */\n::selection{background:#C0FF94;color:#163137}\n:focus-visible{outline:2px solid #26525C;outline-offset:3px;border-radius:4px}\n[id]{scroll-margin-top:104px}\n\n/* --- Disclosure pattern (FAQ / accordions) -------------------------------- */\nsummary{cursor:pointer;list-style:none}\nsummary::-webkit-details-marker{display:none}\ndetails[open] .om-plus{transform:rotate(45deg)}\n\n/* --- Plan Studio shell ---------------------------------------------------- */\n/* A fixed 480px shape column against minmax(0,1fr) leaves the panel no floor,\n   so it resolves to 0 on narrow screens. The two-column arrangement is only\n   valid while there is room for both; below that it stacks, and the shape stops\n   pinning above a scrolling panel. A media query is the only thing that can\n   restructure a grid, so it lives here rather than inline. */\n.ps-main{display:grid;grid-template-columns:minmax(0,480px) minmax(340px,1fr)}\n.ps-aside{position:sticky;top:186px}\n@media (max-width:1000px){\n  .ps-main{grid-template-columns:minmax(0,1fr)}\n  .ps-aside{position:static;top:auto}\n}\n\n/* --- Keyframes ------------------------------------------------------------ */\n@keyframes om-typing{\n  0%,80%,100%{opacity:.28;transform:translateY(0)}\n  40%{opacity:1;transform:translateY(-3px)}\n}\n\n@keyframes om-listen{\n  0%{box-shadow:0 0 0 0 rgba(22,49,55,.4)}\n  70%,100%{box-shadow:0 0 0 9px rgba(22,49,55,0)}\n}\n\n@keyframes om-sheen{\n  0%{transform:translateX(-160%)}\n  62%,100%{transform:translateX(420%)}\n}\n@keyframes om-trace{\n  to{stroke-dashoffset:-1000}\n}\n@keyframes om-ring{\n  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 34px 80px -46px rgba(0,0,0,.55), 0 0 0 1px rgba(192,255,148,.2), 0 18px 60px -30px rgba(192,255,148,.18)}\n  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 34px 80px -42px rgba(0,0,0,.5), 0 0 0 1.5px rgba(192,255,148,.5), 0 26px 74px -26px rgba(192,255,148,.48)}\n}\n@keyframes om-breathe{\n  0%,100%{opacity:.10}\n  50%{opacity:.26}\n}\n\n/* --- Disclosure open/close animation -------------------------------------- */\n/* Lets block-size animate to and from auto (Chrome 129+); older engines just\n   snap open exactly as before. */\n:root{interpolate-size:allow-keywords}\ndetails::details-content{\n  block-size:0;\n  opacity:0;\n  overflow:hidden;\n  transition:block-size .34s cubic-bezier(.2,.7,.2,1),opacity .22s ease,content-visibility .34s;\n  transition-behavior:allow-discrete;\n}\ndetails[open]::details-content{block-size:auto;opacity:1}\n\n/* --- Motion --------------------------------------------------------------- */\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n  *,*::before,*::after{\n    animation-duration:.001ms !important;\n    animation-iteration-count:1 !important;\n    transition-duration:.001ms !important;\n  }\n}\n<\u002Fstyle>\n\n<style>\n  a{color:#26525C}\n  a:hover{color:#163137}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#FDFCFB;color:#163137;font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif\">\n\n  <header style=\"position:sticky;top:0;z-index:40;background:rgba(253,252,251,0.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(22,49,55,0.12)\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:18px 28px 0;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between\">\n      <div>\n        <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#26525C\">Plan Studio<\u002Fdiv>\n        <h1 style=\"margin:8px 0 0;font-size:clamp(26px,2.6vw,40px);line-height:0.98;letter-spacing:-0.04em;font-weight:700\"><i>Finally.<\u002Fi> Build your own health benefits.<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">\n        <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C\">Your plan<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px;justify-content:flex-end\">\n          <div style=\"font-size:clamp(34px,3.6vw,54px);font-weight:800;letter-spacing:-0.05em;line-height:0.94\">{{ totalLabel }}<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:500;color:#26525C\">a month<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:500;color:#26525C\">{{ annualLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1440px;margin:0 auto;padding:14px 28px 14px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center\">\n      <sc-for list=\"{{ switches }}\" as=\"sw\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#26525C\">{{ sw.label }}<\u002Fspan>\n          <div style=\"display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(22,49,55,0.07)\">\n            <sc-for list=\"{{ sw.options }}\" as=\"opt\" hint-placeholder-count=\"2\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.onClick }}\" aria-pressed=\"{{ opt.pressed }}\" style=\"font-family:inherit;font-size:12px;font-weight:600;letter-spacing:-0.01em;border:0;border-radius:999px;min-height:44px;padding:6px 16px;cursor:pointer;transition:background-color .2s ease,color .2s ease;background:{{ opt.bg }};color:{{ opt.fg }}\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main class=\"ps-main\" style=\"max-width:1440px;margin:0 auto;padding:clamp(24px,3vw,44px) 28px clamp(60px,7vw,110px);gap:clamp(28px,3.4vw,56px);align-items:start\">\n\n    <aside class=\"ps-aside\" style=\"display:flex;flex-direction:column;gap:26px\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:6px\">\n          <sc-for list=\"{{ cells }}\" as=\"cell\" hint-placeholder-count=\"10\">\n            <button type=\"button\" sc-camel-on-click=\"{{ cell.onClick }}\" aria-pressed=\"{{ cell.pressed }}\" style=\"position:relative;font-family:inherit;text-align:left;border:0;border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:background-color .28s ease,color .28s ease,box-shadow .24s ease,transform .24s cubic-bezier(.2,.7,.2,1);grid-column:{{ cell.col }};aspect-ratio:{{ cell.ratio }};background:{{ cell.bg }};color:{{ cell.fg }};box-shadow:{{ cell.ring }}\" style-hover=\"transform:translateY(-2px)\">\n              <span style=\"display:block;font-size:11.5px;font-weight:700;line-height:1.14;letter-spacing:-0.015em\">{{ cell.label }}<\u002Fspan>\n              <span style=\"display:block\">\n                <span style=\"display:block;font-family:'DM Mono',monospace;font-size:10px;line-height:1.2;min-height:1.2em;color:{{ cell.metaFg }}\">{{ cell.meta }}<\u002Fspan>\n                <span style=\"display:block;margin-top:6px;height:3px;border-radius:2px;background:{{ cell.trackBg }}\">\n                  <span style=\"display:block;height:3px;border-radius:2px;background:{{ cell.fillBg }};width:{{ cell.fillW }};transition:width .4s cubic-bezier(.2,.7,.2,1)\"><\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.45;font-weight:500;color:#26525C\">Medical and telehealth are the base. Everything else levers off it — turn it on, set its level, or leave it out.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C\">Start where you recognise yourself<\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ personas }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" aria-pressed=\"{{ p.pressed }}\" style=\"font-family:inherit;text-align:left;border:1px solid rgba(22,49,55,0.12);border-radius:16px;padding:14px 16px;cursor:pointer;transition:background-color .22s ease,border-color .22s ease,transform .22s cubic-bezier(.2,.7,.2,1);background:{{ p.bg }};border-color:{{ p.border }}\" style-hover=\"transform:translateY(-2px)\">\n              <span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n                <span style=\"font-size:15.5px;font-weight:700;letter-spacing:-0.02em;color:{{ p.nameFg }}\">{{ p.name }}<\u002Fspan>\n                <span style=\"flex:none;font-family:'DM Mono',monospace;font-size:11px;color:{{ p.metaFg }}\">{{ p.price }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:block;margin-top:4px;font-size:13px;line-height:1.4;font-weight:500;color:{{ p.metaFg }}\">{{ p.who }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:12.5px;line-height:1.45;font-weight:500;color:#26525C\">Nine shapes, $28 to $241 at age 25. Same bookends every time — the middle is what differs.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <section style=\"min-width:0\">\n      <div style=\"background:#F4F3EE;border-radius:28px;padding:clamp(24px,2.4vw,38px)\">\n\n      <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-start\">\n          <div style=\"min-width:0\">\n            <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C\">Your whole plan<\u002Fdiv>\n            <h2 style=\"margin:12px 0 0;font-size:clamp(26px,2.5vw,38px);line-height:1.04;letter-spacing:-0.038em;font-weight:700;max-width:24ch\">{{ planTitle }}<\u002Fh2>\n            <p style=\"margin:10px 0 0;font-size:16px;line-height:1.5;font-weight:500;color:#26525C;max-width:56ch\">{{ planDesc }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:none;text-align:right\">\n            <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#26525C\">Maximum annual benefit<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:clamp(26px,2.4vw,36px);font-weight:800;letter-spacing:-0.045em;line-height:0.96\">{{ planAnnual }}<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:13.5px;font-weight:500;color:#26525C;max-width:22ch\">{{ planLumps }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px;border-top:1px solid rgba(22,49,55,0.14)\">\n          <sc-for list=\"{{ planGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"padding:18px 0;border-bottom:1px solid rgba(22,49,55,0.1)\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:baseline\">\n                <button type=\"button\" sc-camel-on-click=\"{{ g.onClick }}\" style=\"font-family:inherit;font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#163137;background:transparent;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:0.24em;text-decoration-color:rgba(38,82,92,0.32);transition:text-decoration-color .2s ease\" style-hover=\"text-decoration-color:#163137\">{{ g.name }}<\u002Fbutton>\n                <span style=\"flex:none;margin-left:auto;display:flex;align-items:baseline;gap:14px\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#26525C\">{{ g.tierName }}<\u002Fspan>\n                  <span style=\"font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:#163137\">{{ g.price }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.lines }}\" as=\"ln\" hint-placeholder-count=\"3\">\n                <div style=\"margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:space-between;align-items:baseline\">\n                  <span style=\"font-size:15px;font-weight:500;color:#26525C\">{{ ln.name }}<\u002Fspan>\n                  <span style=\"flex:none;margin-left:auto;font-family:'DM Mono',monospace;font-size:13px;color:#163137\">{{ ln.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:18px 0 0;font-size:13.5px;line-height:1.5;font-weight:500;color:#26525C;max-width:70ch\">{{ planFoot }}<\u002Fp>\n        <div style=\"margin-top:26px;padding:clamp(20px,2.2vw,30px);border-radius:24px;background:#163137;color:#F4F3EE\">\n          <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(244,243,238,0.62)\">A normal year<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font-size:clamp(19px,1.8vw,27px);line-height:1.22;font-weight:700;letter-spacing:-0.028em;max-width:32ch\">{{ evenHead }}<\u002Fp>\n          <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:14px;max-width:580px\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;font-weight:600;color:rgba(244,243,238,0.8)\">\n                <span>You pay<\u002Fspan>\n                <span style=\"font-family:'DM Mono',monospace\">{{ evenPrem }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:7px;height:10px;border-radius:5px;background:rgba(244,243,238,0.14)\">\n                <div style=\"height:10px;border-radius:5px;background:rgba(244,243,238,0.5);width:{{ evenPremW }};transition:width .5s cubic-bezier(.2,.7,.2,1)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;font-weight:600;color:#C0FF94\">\n                <span>{{ evenPayLabel }}<\u002Fspan>\n                <span style=\"font-family:'DM Mono',monospace\">{{ evenPay }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:7px;height:10px;border-radius:5px;background:rgba(244,243,238,0.14)\">\n                <div style=\"height:10px;border-radius:5px;background:#C0FF94;width:{{ evenPayW }};transition:width .5s cubic-bezier(.2,.7,.2,1)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.5;font-weight:500;color:rgba(244,243,238,0.68);max-width:64ch\">{{ evenSplit }}<\u002Fp>\n          <sc-if value=\"{{ showLumps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:20px;padding:16px 18px;border-radius:18px;border:1px solid rgba(192,255,148,0.45);max-width:580px\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-size:14px;font-weight:600;color:rgba(244,243,238,0.8)\">And if something serious happens<\u002Fspan>\n                <span style=\"flex:none;font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:#C0FF94\">{{ lumpsFigure }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.5;font-weight:500;color:rgba(244,243,238,0.72);max-width:58ch\">{{ lumpsBody }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <p style=\"margin:18px 0 0;font-size:15px;line-height:1.5;font-weight:500;color:rgba(244,243,238,0.8);max-width:64ch\">{{ evenSub }}<\u002Fp>\n          <div style=\"margin-top:22px;padding-top:20px;border-top:1px solid rgba(244,243,238,0.18)\">\n            <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(244,243,238,0.62)\">And everything without a price on it<\u002Fdiv>\n            <div style=\"margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 26px\">\n              <sc-for list=\"{{ extras }}\" as=\"x\" hint-placeholder-count=\"6\">\n                <div>\n                  <div style=\"font-size:15px;font-weight:700;letter-spacing:-0.018em\">{{ x.name }}<\u002Fdiv>\n                  <div style=\"margin-top:4px;font-size:13.5px;line-height:1.45;font-weight:500;color:rgba(244,243,238,0.74)\">{{ x.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showPlanBench }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid rgba(244,243,238,0.18)\">\n              <p style=\"margin:0;font-size:13.5px;line-height:1.5;font-weight:500;color:rgba(244,243,238,0.78);max-width:70ch\">{{ planBenchAside }}<\u002Fp>\n              <p style=\"margin:10px 0 0;font-size:12.5px;line-height:1.5;font-weight:500;color:rgba(244,243,238,0.62);max-width:74ch\">{{ planBenchNote }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isModule }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ open.onBack }}\" style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C;background:transparent;border:0;padding:0 0 16px;cursor:pointer;transition:color .2s ease\" style-hover=\"color:#163137\">← Your whole plan<\u002Fbutton>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-start\">\n          <div style=\"min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C\">{{ open.eyebrow }}<\u002Fspan>\n              <sc-if value=\"{{ open.isSpine }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:#163137;background:#C0FF94;border-radius:999px;padding:3px 8px\">Base spine<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <h2 style=\"margin:12px 0 0;font-size:clamp(24px,2.3vw,34px);line-height:1.08;letter-spacing:-0.035em;font-weight:700;max-width:24ch\">{{ open.title }}<\u002Fh2>\n            <p style=\"margin:10px 0 0;font-size:16px;line-height:1.5;font-weight:500;color:#26525C;max-width:56ch\">{{ open.desc }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:none;text-align:right\">\n            <div style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#26525C\">{{ open.priceCaption }}<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:clamp(26px,2.4vw,36px);font-weight:800;letter-spacing:-0.045em;line-height:0.96\">{{ open.price }}<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:13.5px;font-weight:500;color:#26525C;max-width:20ch\">{{ open.payback }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ open.hasTiers }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:26px;padding-top:22px;border-top:1px solid rgba(22,49,55,0.14)\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:baseline\">\n              <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#26525C\">Level<\u002Fspan>\n              <sc-if value=\"{{ open.canToggle }}\" hint-placeholder-val=\"{{ true }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ open.onToggle }}\" style=\"font-family:inherit;font-size:13px;font-weight:600;color:#26525C;background:transparent;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:0.24em;text-decoration-color:rgba(38,82,92,0.4);transition:color .2s ease\" style-hover=\"color:#163137\">{{ open.toggleLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px\">\n              <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"7\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" aria-pressed=\"{{ t.pressed }}\" disabled=\"{{ t.disabled }}\" style=\"font-family:inherit;text-align:left;border:1px solid rgba(22,49,55,0.12);border-radius:14px;padding:11px 12px;transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .2s cubic-bezier(.2,.7,.2,1);background:{{ t.bg }};color:{{ t.fg }};border-color:{{ t.border }};cursor:{{ t.cursor }};opacity:{{ t.opacity }}\" style-hover=\"transform:translateY(-2px)\">\n                  <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:-0.015em\">{{ t.name }}<\u002Fspan>\n                  <span style=\"display:block;margin-top:3px;font-family:'DM Mono',monospace;font-size:10.5px;opacity:0.8;min-height:1.2em\">{{ t.price }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ open.showSplit }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:22px 0 0;padding:14px 16px;border-radius:16px;background:rgba(22,49,55,0.06);font-size:13.5px;line-height:1.5;font-weight:500;color:#163137;max-width:70ch\">Two kinds of line below. <strong style=\"font-weight:700\">Everyday care<\u002Fstrong> is what this covers outright — the visit, the test, the script. <strong style=\"font-weight:700\">Big events<\u002Fstrong> get cash toward a much larger bill, and critical illness is what actually carries those. We would rather show you the difference than average it away.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"margin-top:26px;padding-top:8px;border-top:1px solid rgba(22,49,55,0.14)\">\n          <sc-for list=\"{{ lines }}\" as=\"ln\" hint-placeholder-count=\"6\">\n            <div style=\"padding:15px 0;border-bottom:1px solid rgba(22,49,55,0.1)\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-size:16px;font-weight:600;letter-spacing:-0.015em;color:{{ ln.nameFg }}\">{{ ln.name }}<\u002Fspan>\n                <span style=\"flex:none;margin-left:auto;font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:{{ ln.valueFg }}\">{{ ln.value }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ ln.showDetail }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"margin:6px 0 0;font-size:14px;line-height:1.45;font-weight:500;color:#26525C;max-width:66ch\">{{ ln.detail }}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ ln.showBench }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:10px;max-width:420px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-family:'DM Mono',monospace;font-size:11px;color:#26525C\">\n                    <span>{{ ln.benchLeft }}<\u002Fspan>\n                    <span style=\"color:#163137;font-weight:500\">{{ ln.benchRight }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ ln.showBar }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top:5px;height:5px;border-radius:3px;background:rgba(22,49,55,0.12)\">\n                      <div style=\"height:5px;border-radius:3px;background:#C0FF94;width:{{ ln.benchW }};transition:width .5s cubic-bezier(.2,.7,.2,1)\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ ln.showStack }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"margin:8px 0 0;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:#26525C\">{{ ln.stack }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ open.hasNote }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:18px 0 0;font-size:13.5px;line-height:1.5;font-weight:500;color:#26525C;max-width:70ch\">{{ open.note }}<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ open.showBenchNote }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:14px 0 0;font-size:12.5px;line-height:1.5;font-weight:500;color:#26525C;max-width:74ch\">Cost figures are typical billed national averages — directional estimates drawn from KFF, AHA, AHRQ, ADA and comparable 2024–26 sources. What you are actually charged varies by provider and by state. Pending FAIR Health validation before client-facing use.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:14px 32px;justify-content:space-between;align-items:baseline\">\n        <p style=\"margin:0;flex:1 1 420px;min-width:0;font-size:16px;line-height:1.5;font-weight:500;color:#163137\">{{ summary }}<\u002Fp>\n        <p style=\"margin:0;flex:0 1 auto;font-size:12.5px;font-weight:500;color:#26525C\">Illustrative at 60% loss ratio. Not actuarially certified.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980},&quot;internalMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;telehealthVisits&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot; visits/yr&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Assumptions&quot;}}\">\nconst T = ['Entry', 'Basic', 'Standard', 'Enhanced', 'Premium', 'Elite', 'Apex'];\nconst X = null;\n\n/* Every figure below is transcribed from \"Base 7 + Definitions\" (sheet 3), which\n   is canonical — sheet 1 carries a stale Therapy rate at Basic. Line values are\n   [amount, count]; unit decides how they read and whether they annualise. */\nconst MODULES = [\n  {\n    key: 'medical', label: 'Medical', span: 2, always: true, spine: true,\n    title: 'The base everything else levers off.',\n    desc: 'Hospital and surgical, the outpatient and office visits you actually book, and the diagnostics that tell you what is going on. Fourteen benefits behind one price.',\n    r25: [19.80, 40.80, 60.40, 79.25, 112.76, 126.00, 151.50],\n    r50: [29.55, 60.89, 90.13, 118.26, 168.27, 188.03, 226.08],\n    lines: [\n      { n: 'Hospital admission', d: 'Paid when you are formally admitted as an inpatient.', retail: 20000, unit: 'yr', big: true, stack: 'CI + AME', v: [X, [1000, 1], [1000, 1], [1500, 1], [1500, 1], [2000, 1], [3000, 2]] },\n      { n: 'Each day in hospital', d: 'Paid for every covered day you stay.', retail: 3200, unit: 'day', big: true, stack: 'CI + AME', v: [X, [500, 31], [500, 31], [750, 31], [1000, 31], [1375, 31], [2000, 31]] },\n      { n: 'Each day in intensive care', d: 'Paid on top, for every covered day in the ICU.', retail: 7000, unit: 'day', big: true, stack: 'CI + AME', v: [X, [1000, 5], [1000, 5], [1500, 5], [1500, 5], [2000, 5], [3000, 7]] },\n      { n: 'Surgery in hospital', d: 'Paid per covered procedure performed during a stay.', retail: 25000, unit: 'yr', big: true, stack: 'CI + AME', v: [X, [1000, 1], [1500, 1], [2000, 1], [2000, 1], [3000, 1], [4000, 2]] },\n      { n: 'Anesthesia in hospital', d: 'Paid alongside a covered inpatient procedure.', retail: 2500, unit: 'yr', big: true, stack: 'CI + AME', v: [X, [250, 1], [375, 1], [375, 1], [375, 1], [500, 1], [750, 1]] },\n      { n: 'Day surgery', d: 'A covered procedure with no overnight stay.', retail: 6000, unit: 'yr', big: true, stack: 'CI + AME', v: [X, [250, 1], [375, 2], [375, 2], [375, 2], [500, 2], [1000, 2]] },\n      { n: 'Anesthesia for day surgery', d: 'Paid alongside a covered outpatient procedure.', retail: 1200, unit: 'yr', big: true, stack: 'CI + AME', v: [X, X, [75, 2], [75, 2], [75, 2], [100, 2], [200, 2]] },\n      { n: 'Doctor visit', d: 'Any covered visit with a provider — physical, follow-up, something new.', retail: 155, unit: 'yr', stack: 'CI + AME', v: [[150, 2], [150, 2], [150, 2], [150, 3], [150, 4], [150, 4], [200, 6]] },\n      { n: 'Urgent care', d: 'Walk-in or retail clinic for the small emergencies.', retail: 200, unit: 'yr', stack: 'AME', v: [[150, 2], [150, 2], [150, 2], [150, 2], [150, 2], [150, 2], [200, 4]] },\n      { n: 'Emergency room', d: 'Paid per covered ER visit.', retail: 2400, unit: 'yr', big: true, stack: 'CI + AME', v: [[150, 1], [150, 1], [150, 1], [250, 1], [400, 1], [400, 1], [500, 2]] },\n      { n: 'Ambulance', d: 'Paid per covered trip — ground, air or water.', retail: 1200, unit: 'yr', big: true, stack: 'CI + AME', v: [X, X, X, [150, 1], [300, 1], [300, 1], [500, 2]] },\n      { n: 'X-ray and imaging', d: 'Paid per covered image.', retail: 260, unit: 'yr', stack: 'AME (CI possible)', v: [[50, 1], [50, 1], [100, 2], [100, 2], [150, 2], [150, 2], [200, 3]] },\n      { n: 'Lab and blood work', d: 'Paid per covered test.', retail: 150, unit: 'yr', stack: 'CI possible', v: [[50, 1], [50, 1], [100, 2], [100, 2], [150, 4], [150, 4], [200, 6]] },\n      { n: 'MRI, CT and advanced imaging', d: 'Paid per covered advanced test.', retail: 1300, unit: 'yr', big: true, stack: 'CI + AME', v: [[100, 1], [100, 1], [200, 1], [200, 1], [300, 2], [300, 2], [300, 2]] }\n    ]\n  },\n  {\n    key: 'dental', label: 'Dental', span: 1,\n    title: 'Cleanings, and the things that follow them.',\n    desc: 'The appointment you are supposed to keep twice a year, plus the filling and the extraction you did not plan for.',\n    r25: [18.02, 18.02, 34.52, 34.52, 34.52, 54.72, 54.72],\n    r50: [26.89, 26.89, 51.51, 51.51, 51.51, 81.66, 81.66],\n    note: 'Dental carries a waiting period of up to 60 days.',\n    lines: [\n      { n: 'Cleaning and exam', d: 'Routine preventive care, including fluoride.', retail: 203, unit: 'yr', v: [[100, 2], [100, 2], [100, 2], [100, 2], [100, 2], [150, 2], [150, 2]] },\n      { n: 'Filling or extraction', d: 'Treatment beyond preventive — a cavity, a cracked tooth.', retail: 250, unit: 'yr', stack: 'AME (dental injury)', v: [X, X, [175, 1], [175, 1], [175, 1], [300, 1], [300, 1]] },\n      { n: 'Oral surgery', d: 'Wisdom teeth, implants, outpatient oral surgery.', retail: 450, unit: 'yr', stack: 'AME (dental injury)', v: [X, X, [200, 1], [200, 1], [200, 1], [400, 1], [400, 1]] }\n    ]\n  },\n  {\n    key: 'vision', label: 'Vision', span: 1,\n    title: 'The exam, and what you walk out with.',\n    desc: 'A yearly eye test, and cash toward the glasses or contacts the prescription calls for.',\n    r25: [5.18, 5.18, 12.71, 12.71, 12.71, 16.12, 16.12],\n    r50: [7.73, 7.73, 18.97, 18.97, 18.97, 24.06, 24.06],\n    note: 'Vision carries a waiting period of up to 60 days.',\n    lines: [\n      { n: 'Eye exam', d: 'A covered annual test or new prescription check.', retail: 136, unit: 'yr', v: [[75, 1], [75, 1], [75, 1], [75, 1], [75, 1], [100, 1], [100, 1]] },\n      { n: 'Glasses or contacts', d: 'Paid toward covered corrective lenses.', retail: 340, unit: 'yr', v: [X, X, [110, 1], [110, 1], [110, 1], [200, 1], [200, 1]] }\n    ]\n  },\n  {\n    key: 'pharmacy', label: 'Pharmacy', span: 1,\n    title: 'Cash at the counter, every refill.',\n    desc: 'Paid per prescription filled rather than as a discount card. Brand-name cover joins from Enhanced.',\n    r25: [8.33, 11.67, 11.67, 18.50, 18.50, 18.50, 21.67],\n    r50: [12.43, 17.42, 17.42, 27.61, 27.61, 27.61, 32.33],\n    lines: [\n      { n: 'Generic prescription', d: 'Paid each time you fill a covered generic.', retail: 25, unit: 'yr', stack: 'AME possible', v: [[10, 6], [10, 12], [10, 12], [10, 24], [10, 24], [10, 24], [10, 36]] },\n      { n: 'Brand-name prescription', d: 'Paid each time you fill a covered brand drug.', retail: 380, unit: 'yr', stack: 'AME possible', v: [X, X, X, [30, 12], [30, 12], [30, 12], [40, 12]] }\n    ]\n  },\n  {\n    key: 'accident', label: 'Accident', span: 1,\n    title: 'For the one bad day.',\n    desc: 'Reimburses what an accident actually costs you, up to the plan maximum — and stacks on top of every medical benefit for the same treatment.',\n    r25: [21.30, 21.30, 27.39, 37.57, 37.57, 37.57, 48.30],\n    r50: [19.64, 19.64, 25.26, 34.64, 34.64, 34.64, 44.54],\n    note: 'A separate accident policy. Reimburses real expenses within a defined window from the accident date.',\n    lines: [\n      { n: 'Accident medical expense', d: 'Actual accident-caused medical costs, reimbursed up to the maximum.', unit: 'max', v: [[5000, 1], [5000, 1], [10000, 1], [15000, 1], [20000, 1], [20000, 1], [25000, 1]] },\n      { n: 'Accidental death and dismemberment', d: 'A lump sum on accidental death or a covered serious injury.', unit: 'lump', v: [[25000, 1], [25000, 1], [50000, 1], [75000, 1], [75000, 1], [75000, 1], [100000, 1]] }\n    ]\n  },\n  {\n    key: 'ci', label: 'Critical illness', span: 1,\n    title: 'One diagnosis, one payment, no receipts.',\n    desc: 'Cash paid straight to you on first diagnosis of a covered condition. It is not tied to a service, so it stacks on everything else the episode triggers.',\n    r25: [5.13, 12.83, 25.67, 25.67, 38.48, 38.50, 51.33],\n    r50: [7.66, 19.15, 38.31, 38.31, 57.42, 57.45, 76.60],\n    note: 'Guaranteed issue — no medical questions. Six covered conditions: cancer, heart attack, kidney failure, major organ transplant, paralysis, stroke. 30-day waiting period.',\n    lines: [\n      { n: 'Lump sum on diagnosis', d: 'Paid once, on first diagnosis of a covered condition.', unit: 'lump', v: [[10000, 1], [25000, 1], [50000, 1], [50000, 1], [75000, 1], [75000, 1], [100000, 1]] }\n    ]\n  },\n  {\n    key: 'behavioral', label: 'Mental health', span: 1, min: 3,\n    title: 'Someone to talk to, paid per session.',\n    desc: 'Counselling and behavioral health visits, paid as cash per session rather than a network you have to hunt through.',\n    r25: [X, X, X, 9.38, 28.12, 46.88, 62.50],\n    r50: [X, X, X, 14.00, 41.96, 69.96, 93.27],\n    note: 'Waiting period of up to 60 days. Caps at 12 visits a year, $250 maximum per session.',\n    lines: [\n      { n: 'Counselling session', d: 'A covered visit with a licensed clinician.', retail: 180, unit: 'yr', v: [X, X, X, [75, 6], [150, 9], [250, 9], [250, 12]] }\n    ]\n  },\n  {\n    key: 'therapy', label: 'Therapy', span: 1, min: 3,\n    title: 'Getting back to how you were.',\n    desc: 'Physical, occupational and speech therapy — the rehabilitation after the injury or the operation.',\n    r25: [X, X, X, 6.25, 18.75, 37.50, 62.50],\n    r50: [X, X, X, 9.33, 27.98, 55.96, 93.27],\n    note: 'Caps at 12 visits a year, $250 maximum per service.',\n    lines: [\n      { n: 'Therapy visit', d: 'A covered physical, occupational or speech therapy session.', retail: 150, unit: 'yr', stack: 'AME', v: [X, X, X, [50, 6], [100, 9], [150, 12], [250, 12]] }\n    ]\n  },\n  {\n    key: 'wellness', label: 'Wellness', span: 1, min: 3,\n    title: 'Staying ahead of it.',\n    desc: 'The annual screening that finds the thing early, paid as cash whether or not anything turns up.',\n    r25: [X, X, X, 4.86, 12.15, 19.44, 24.31],\n    r50: [X, X, X, 7.25, 18.13, 29.01, 36.28],\n    lines: [\n      { n: 'Wellness screening', d: 'A covered annual wellness visit or preventive screening.', retail: 400, unit: 'yr', v: [X, X, X, [100, 1], [250, 1], [400, 1], [500, 1]] }\n    ]\n  },\n  {\n    key: 'telehealth', label: 'Telehealth', span: 2, always: true, free: true, spine: true,\n    title: 'Included, at every level, for nothing.',\n    desc: 'A doctor by phone or video whenever you need one. It is not a tier and it is not an add-on — it is simply part of the base.',\n    lines: [\n      { n: 'Virtual doctor visit', d: 'Phone or video with a provider. Cold symptoms, a refill, a follow-up.', retail: 79, unit: 'free', v: null }\n    ]\n  }\n];\n\n/* The nine Plan Shapes, in deck order. Each one answers a single worry, and its\n   composition is the reason its price is what it is — every figure here sums\n   cell-by-cell from the matrix, so the rail prices are derived, never typed. */\n/* Each shape carries a person's name, because \"Gina's plan\" is a thing somebody\n   built for herself and \"Stay Ahead\" is a thing we built for a segment. Same\n   composition either way — but one of them can be handed to a stranger and\n   asked \"does this look like you?\", and it gives the team one word to talk\n   about internally. */\nconst PERSONAS = [\n  { key: 'offzero', name: 'Off Zero', person: 'Devon', who: '“I can’t afford anything, so I have nothing.”', tiers: { medical: 0, pharmacy: 0 },\n    why: 'Devon has been telling himself he will sort it out later. This is the floor — a doctor, a test, a script, and nothing else — built to cost less than the thing he is currently doing, which is nothing. It carries no hospital layer, and he should know that before he signs.' },\n  { key: 'between', name: 'Between Things', person: 'Marisol', who: '“Something happens in the next three months and I’m exposed.”', tiers: { medical: 1, pharmacy: 1, accident: 2 },\n    why: 'Marisol is sixty days into a ninety-day waiting period. She only needs this to hold until her employer plan starts, so she skipped everything routine and put the money into hospital and accident — because a bridge that does not cover a hospital stay is not a bridge.' },\n  { key: 'clearhead', name: 'Clear Head', person: 'Jennifer', who: '“I’m paying out of pocket for the one thing I actually use.”', tiers: { medical: 1, pharmacy: 1, behavioral: 4, wellness: 4 },\n    why: 'Jennifer is already in counselling and paying cash for it every week. So she took mental health to Premium rather than the level that merely exists, and let dental and vision go — she would rather have the sessions covered properly than a little of everything.' },\n  { key: 'everyday', name: 'Everyday', person: 'Michael', who: '“None of it is covered and none of it stops.”', tiers: { medical: 1, dental: 2, vision: 2, pharmacy: 2 },\n    why: 'Nothing dramatic ever happens to Michael. It is a cleaning, a new pair of glasses and a script most months, and none of it is covered. Dental and vision sit at the level that covers the filling, because the filling is the bill that actually surprises him.' },\n  { key: 'justincase', name: 'Just in Case', person: 'Priya', who: '“I’m fine until I’m not, and then I’m ruined.”', tiers: { medical: 1, accident: 2, ci: 4, wellness: 3 },\n    why: 'Priya barely sees a doctor and has quietly done the maths on a bad year. She put nothing into routine care and took critical illness to Premium on purpose — a small lump sum is not protection, and going cheap there would make the whole plan a gesture.' },\n  { key: 'onmyfeet', name: 'On My Feet', person: 'Luis', who: '“If it goes, the income goes with it.”', tiers: { medical: 1, pharmacy: 1, accident: 6, therapy: 4 },\n    why: 'Luis works with his hands, so his body is the business. Accident sits at the highest level available anywhere in the product, with the therapy to get him back on site afterwards — everything else is secondary to the one risk that stops his income.' },\n  { key: 'stayahead', name: 'Stay Ahead', person: 'Gina', who: '“Something is building and I won’t know until it costs.”', tiers: { medical: 2, dental: 1, vision: 2, pharmacy: 3, wellness: 6 },\n    why: 'Gina books the screening, takes the maintenance script and reads the results. Wellness at the top and brand-name pharmacy on is a position about time horizon, not about her health — she would rather find out early than find out expensive.' },\n  { key: 'countedon', name: 'Counted On', person: 'Andre', who: '“If I go down, everyone goes down.”', tiers: { medical: 2, accident: 6, ci: 6, wellness: 4 },\n    why: 'Other people’s rent depends on Andre’s income arriving. Both cash benefits sit at the top — the largest payouts in the product, paid straight to him — because what is exposed here is a household, not a medical bill. This covers the earner.' },\n  { key: 'likeforlike', name: 'Like For Like', person: 'Paul', who: '“I don’t know what I’m losing.”', tiers: { medical: 5, dental: 1, vision: 1, pharmacy: 5, accident: 2, ci: 2, behavioral: 3, therapy: 3, wellness: 3 },\n    why: 'Paul’s premium doubled when the subsidy went, and he will compare this line by line. Everything is on, but nothing is level: medical near the top, dental and vision at the bottom, because the plan he is leaving covered no adult dental at all.' }\n];\n\nclass Component extends DCLogic {\n  /* The shape's resting state IS the whole plan, so `open: null` is the summary\n     view and drilling into a cell is the exception. No tabs, no second page —\n     the thing you built is what you see when nothing is selected. */\n  state = {\n    age: 25,\n    open: null,\n    detail: 1,\n    prices: true,\n    bench: true,\n    tiers: { medical: 1, dental: 2, vision: 2, pharmacy: 2 },\n    persona: 'everyday'\n  };\n\n  mod(key) { return MODULES.filter(m => m.key === key)[0]; }\n\n  rate(m, tier) {\n    if (m.free) return 0;\n    const row = this.state.age === 50 ? m.r50 : m.r25;\n    const v = row && row[tier];\n    return typeof v === 'number' ? v : 0;\n  }\n\n  money(n) {\n    return '$' + Math.round(n).toLocaleString('en-US');\n  }\n\n  /* Recurring service benefits annualise; a lump sum or an expense maximum does\n     not, so it is never folded into an annual figure. */\n  annualMax(m, tier) {\n    let sum = 0;\n    m.lines.forEach(l => {\n      if (l.unit !== 'yr' && l.unit !== 'day') return;\n      const v = l.v && l.v[tier];\n      if (v) sum += v[0] * v[1];\n    });\n    return sum;\n  }\n\n  /* A shape is recognised by its composition, not by which button was last\n     pressed — so hand-building Everyday names itself Everyday, and changing one\n     level makes it yours. */\n  signature(tiers) {\n    return MODULES.filter(m => !m.free).map(m => {\n      const t = tiers[m.key];\n      return m.key + ':' + (typeof t === 'number' ? t : (m.always ? 0 : 'x'));\n    }).join('|');\n  }\n\n  matchShape() {\n    const now = this.signature(this.state.tiers);\n    return PERSONAS.filter(p => this.signature(p.tiers) === now)[0] || null;\n  }\n\n  activeTiers() {\n    const t = this.state.tiers;\n    return MODULES.filter(m => m.always || typeof t[m.key] === 'number');\n  }\n\n  tierOf(m) {\n    if (m.free) return null;\n    const t = this.state.tiers[m.key];\n    return typeof t === 'number' ? t : (m.always ? 0 : null);\n  }\n\n  monthly() {\n    let sum = 0;\n    this.activeTiers().forEach(m => { sum += this.rate(m, this.tierOf(m) || 0); });\n    return sum;\n  }\n\n  setTier(key, tier) {\n    const t = Object.assign({}, this.state.tiers);\n    t[key] = tier;\n    this.setState({ tiers: t, persona: null });\n  }\n\n  toggleModule(key) {\n    const m = this.mod(key);\n    const t = Object.assign({}, this.state.tiers);\n    if (typeof t[key] === 'number') delete t[key]; else t[key] = m.min || 0;\n    this.setState({ tiers: t, persona: null });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const internal = this.props.internalMode === true;\n    // depends only on state.tiers, so it belongs at the top — read further down\n    // by both the persona rail and the plan header\n    const shape = this.matchShape();\n    const total = this.monthly();\n\n    let annual = 0;\n    let lumps = 0;\n    this.activeTiers().forEach(m => {\n      const t = this.tierOf(m) || 0;\n      annual += this.annualMax(m, t);\n      m.lines.forEach(l => {\n        if (l.unit !== 'lump' && l.unit !== 'max') return;\n        const v = l.v && l.v[t];\n        if (v) lumps += v[0];\n      });\n    });\n\n    let col = 1;\n    const cells = MODULES.map(m => {\n      const tier = this.tierOf(m);\n      const on = m.always || tier !== null;\n      const isOpen = s.open === m.key;\n      const span = m.span === 2 ? 'span 2' : 'auto';\n      const rate = on ? this.rate(m, tier || 0) : 0;\n      return {\n        key: m.key,\n        label: m.label,\n        col: span,\n        // the square singles set the row height; a ratio on the double-wides\n        // would fight it, and the correct constant is width-dependent anyway\n        ratio: m.span === 2 ? 'auto' : '1',\n        pressed: on ? 'true' : 'false',\n        bg: on ? (m.always ? '#163137' : '#1D4048') : 'rgba(22,49,55,0.13)',\n        // an off cell is the discovery path for everything not yet added, so its\n        // label has to be readable, not decorative\n        fg: on ? '#F4F3EE' : 'rgba(22,49,55,0.72)',\n        // stated per state rather than muted with opacity — an inherited\n        // translucent colour plus opacity compounds and fails contrast when off\n        metaFg: on ? 'rgba(244,243,238,0.75)' : 'rgba(22,49,55,0.72)',\n        ring: isOpen ? '0 0 0 2px #C0FF94' : '0 0 0 0 rgba(0,0,0,0)',\n        meta: !on ? 'off' : (m.free ? 'free' : (s.prices ? '$' + rate.toFixed(2) : T[tier || 0])),\n        trackBg: on ? 'rgba(244,243,238,0.22)' : 'rgba(22,49,55,0.12)',\n        fillBg: on ? '#C0FF94' : 'transparent',\n        fillW: on && !m.free ? Math.round(((tier || 0) + 1) / 7 * 100) + '%' : (m.free ? '100%' : '0%'),\n        onClick: () => this.setState({ open: isOpen ? null : m.key })\n      };\n    });\n\n    const m = this.mod(s.open) || MODULES[0];\n    const tier = this.tierOf(m);\n    const active = m.always || tier !== null;\n    const shownTier = tier === null ? (m.min || 0) : tier;\n\n    const tiers = T.map((name, i) => {\n      const r = this.rate(m, i);\n      const avail = m.free ? false : (i >= (m.min || 0));\n      const pressed = active && shownTier === i;\n      return {\n        name: name,\n        pressed: pressed ? 'true' : 'false',\n        disabled: avail ? null : true,\n        cursor: avail ? 'pointer' : 'not-allowed',\n        opacity: avail ? '1' : '0.34',\n        bg: pressed ? '#163137' : 'transparent',\n        fg: pressed ? '#F4F3EE' : '#163137',\n        border: pressed ? '#163137' : 'rgba(22,49,55,0.12)',\n        price: !avail ? '—' : (s.prices ? '$' + r.toFixed(2) : ''),\n        onClick: avail ? () => this.setTier(m.key, i) : () => {}\n      };\n    });\n\n    const lines = m.lines.map(l => {\n      const v = l.v ? l.v[shownTier] : null;\n      const free = l.unit === 'free';\n      let value = '—';\n      if (free) value = 'Included · no charge';\n      else if (v && l.unit === 'yr') value = '$' + v[0].toLocaleString('en-US') + ' × ' + v[1] + '/yr';\n      else if (v && l.unit === 'day') value = '$' + v[0].toLocaleString('en-US') + '/day × ' + v[1];\n      else if (v && l.unit === 'lump') value = this.money(v[0]);\n      else if (v && l.unit === 'max') value = this.money(v[0]) + ' max';\n\n      let firstAt = -1;\n      if (l.v) for (let i = 0; i < 7; i++) { if (l.v[i]) { firstAt = i; break; } }\n      const covered = free || !!v;\n\n      const perPay = v ? v[0] : 0;\n      const annualPay = v && (l.unit === 'yr' || l.unit === 'day') ? v[0] * v[1] : 0;\n      const annualCost = l.retail && v ? l.retail * v[1] : 0;\n      const pct = l.retail ? Math.round(perPay / l.retail * 100) : 0;\n\n      /* A percentage invites the reader to grade us against major medical — a\n         test we lose on a $20,000 admission and win outright on a $25 script.\n         So a big-event line states the cash it puts toward the bill and does not\n         pretend to be a proportion; an everyday line shows the proportion,\n         because that is where the argument actually is. */\n      return {\n        name: l.n,\n        // an uncovered row is the upgrade path, so it is muted by colour, never\n        // by alpha — a translucent ink on cream does not clear AA\n        nameFg: covered ? '#163137' : '#26525C',\n        valueFg: covered ? '#163137' : '#26525C',\n        value: covered\n          ? (s.detail === 0 ? 'Covered' : value)\n          : (firstAt > -1 ? (s.detail === 0 ? 'Not at this level' : 'From ' + T[firstAt]) : 'Not covered'),\n        showDetail: s.detail === 1 && covered,\n        detail: l.d,\n        showBench: s.bench && covered && !!l.retail && !!v && s.detail > 0,\n        showBar: !l.big,\n        benchLeft: l.retail ? (l.big ? 'A ' + this.money(l.retail) + ' bill' : 'Costs about ' + this.money(l.retail)) : '',\n        // the cost is an average, so the claim has to survive being an average —\n        // a visit above typical is not \"fully covered\"\n        // capping the label at \"covers the typical cost\" hid the difference\n        // between Elite and Apex, which is the reason to go up a level\n        benchRight: l.big\n          ? this.money(perPay) + ' cash toward it'\n          : pct + '% of typical',\n        // bar tops out at full; the number carries anything above it\n        benchW: Math.min(100, pct) + '%',\n        showStack: internal && !!l.stack,\n        stack: l.stack ? 'Stacks: ' + l.stack : ''\n      };\n    });\n\n    const rate = active ? this.rate(m, shownTier) : this.rate(m, shownTier);\n    const modAnnual = this.annualMax(m, shownTier);\n\n    const switches = [\n      { label: 'Age', options: [25, 50].map(a => ({ label: String(a), pressed: s.age === a ? 'true' : 'false', bg: s.age === a ? '#163137' : 'transparent', fg: s.age === a ? '#F4F3EE' : '#26525C', onClick: () => this.setState({ age: a }) })) },\n      // two states, not three — the middle one never had anything of its own to say\n      { label: 'Detail', options: ['Simple', 'Detailed'].map((n, i) => ({ label: n, pressed: s.detail === i ? 'true' : 'false', bg: s.detail === i ? '#163137' : 'transparent', fg: s.detail === i ? '#F4F3EE' : '#26525C', onClick: () => this.setState({ detail: i }) })) },\n      { label: 'Prices', options: [['On', true], ['Off', false]].map(o => ({ label: o[0], pressed: s.prices === o[1] ? 'true' : 'false', bg: s.prices === o[1] ? '#163137' : 'transparent', fg: s.prices === o[1] ? '#F4F3EE' : '#26525C', onClick: () => this.setState({ prices: o[1] }) })) },\n      { label: 'Vs real cost', options: [['On', true], ['Off', false]].map(o => ({ label: o[0], pressed: s.bench === o[1] ? 'true' : 'false', bg: s.bench === o[1] ? '#163137' : 'transparent', fg: s.bench === o[1] ? '#F4F3EE' : '#26525C', onClick: () => this.setState({ bench: o[1] }) })) }\n    ];\n\n    const personas = PERSONAS.map(p => {\n      let sum = 0;\n      MODULES.forEach(mm => {\n        const t = mm.always ? (p.tiers[mm.key] || 0) : p.tiers[mm.key];\n        if (typeof t === 'number') sum += this.rate(mm, t);\n      });\n      const on = !!shape && shape.key === p.key;\n      return {\n        name: p.person + '’s plan — ' + p.name,\n        who: p.who,\n        price: '$' + sum.toFixed(0) + '/mo',\n        pressed: on ? 'true' : 'false',\n        bg: on ? '#163137' : '#F4F3EE',\n        border: on ? '#163137' : 'rgba(22,49,55,0.12)',\n        nameFg: on ? '#F4F3EE' : '#163137',\n        metaFg: on ? 'rgba(244,243,238,0.72)' : '#26525C',\n          onClick: () => this.setState({ tiers: Object.assign({}, p.tiers), persona: p.key, open: null })\n      };\n    });\n\n    /* Detail level is what the plan view is FOR: Simple is the plan at a\n       glance, Standard is every benefit and what it pays, Full adds the caps\n       and waiting periods. */\n    const planGroups = this.activeTiers().map(mm => {\n      const t = this.tierOf(mm) || 0;\n      return {\n        name: mm.label,\n        tierName: mm.free ? 'included' : T[t],\n        price: mm.free ? 'free' : (s.prices ? '$' + this.rate(mm, t).toFixed(2) : ''),\n        onClick: () => this.setState({ open: mm.key }),\n        lines: s.detail === 0 ? [] : mm.lines.map(l => {\n          const v = l.v ? l.v[t] : null;\n          let value = '—';\n          if (l.unit === 'free') value = 'Included';\n          else if (v && l.unit === 'yr') value = '$' + v[0].toLocaleString('en-US') + ' × ' + v[1] + '/yr';\n          else if (v && l.unit === 'day') value = '$' + v[0].toLocaleString('en-US') + '/day × ' + v[1];\n          else if (v && l.unit === 'lump') value = this.money(v[0]);\n          else if (v && l.unit === 'max') value = this.money(v[0]) + ' max';\n          return { name: l.n, value: value, skip: !v && l.unit !== 'free' };\n        }).filter(x => !x.skip)\n      };\n    });\n\n    /* Aggregated at plan level rather than per line, because thirty bars is the\n       spreadsheet this exists to replace. Everyday lines only — folding a\n       $20,000 admission into the average would flatter the number and bury the\n       distinction the module view is careful to draw. */\n    let evCost = 0, evPay = 0;\n    this.activeTiers().forEach(mm => {\n      const t = this.tierOf(mm) || 0;\n      mm.lines.forEach(l => {\n        if (l.big || !l.retail) return;\n        const v = l.v ? l.v[t] : null;\n        if (!v || (l.unit !== 'yr' && l.unit !== 'day')) return;\n        evCost += l.retail * v[1];\n        evPay += v[0] * v[1];\n      });\n    });\n    const evPct = evCost ? Math.round(evPay / evCost * 100) : 0;\n\n    /* Telehealth is $0 to the member but it is not free to provide, and a visit\n       has a real market price. It pays no cash, so it is never folded into the\n       benefit figure — it is counted as cost avoided, at a stated number of\n       visits, so the assumption is visible and arguable rather than buried. */\n    const teleVisits = typeof this.props.telehealthVisits === 'number' ? this.props.telehealthVisits : 3;\n    const teleRate = 79;\n    const teleValue = teleVisits * teleRate;\n\n    const prem = total * 12;\n    const back = evPay + teleValue;\n    const peak = Math.max(prem, back) || 1;\n    const ratio = prem ? back / prem : 0;\n\n    /* The things that never appear as a payout, which is exactly why they have to\n       be said out loud — and an honest first item when the medical base carries\n       no hospital layer. */\n    const medTier = this.tierOf(this.mod('medical')) || 0;\n    const extras = [];\n    if (medTier === 0) extras.push({ name: 'No hospital cover', detail: 'This medical base pays for visits, tests and scripts — not an admission. Worth knowing before you choose it.' });\n    else extras.push({ name: 'If the year goes wrong', detail: 'Hospital, ICU and surgery pay cash toward a much larger bill, on top of everything above.' });\n    extras.push({ name: 'Telehealth, always', detail: 'A doctor by phone or video, on every plan, at no charge — it is not a level and not an add-on.' });\n    extras.push({ name: 'No deductible', detail: 'Nothing to clear first. Benefits pay from your first visit of the year, in January or any other month.' });\n    extras.push({ name: 'Any provider', detail: 'No network to stay inside. Go where you already go, and the benefit is the same.' });\n    extras.push({ name: 'Paid to you', detail: 'Benefits arrive as cash in your account, not as a credit at the clinic.' });\n    extras.push({ name: 'The plan is yours', detail: 'It is in your name, not an employer’s. Change jobs, go freelance, move states — nothing lapses.' });\n\n\n    const count = this.activeTiers().length;\n    const off = 10 - count;\n    return {\n      isPlan: s.open === null,\n      isModule: s.open !== null,\n      planTitle: shape ? shape.name : 'Your own shape.',\n      planWorry: shape ? shape.who : '“Exactly how I need it.”',\n      // a named shape explains itself; an edited one is the visitor's own, so it\n      // gets the mechanics instead\n      planDesc: shape ? shape.why : (off === 0\n        ? 'All ten on. Tap any one to change its level or take it back out.'\n        : count + ' of ten on, ' + off + ' left out. Tap any benefit in the shape to change its level, or tap a greyed one to add it.'),\n      planAnnual: this.money(annual),\n      planLumps: 'including hospital and surgical',\n      planGroups: planGroups,\n      showPlanBench: s.bench && evCost > 0,\n      /* Not a percentage. A percentage sets 100 as the pass mark, invites a\n         coinsurance comparison we are not in, and rewards turning benefits off.\n         Premium against benefit is matrix-only, needs no caveat, and supports a\n         harder claim: it pays back about what it costs, and then there is\n         everything a dollar figure cannot show. */\n      evenHead: this.money(prem) + ' of premium. ' + this.money(back) + ' of everyday care.',\n      evenPrem: this.money(prem) + ' a year',\n      evenPay: this.money(back) + ' a year',\n      evenPayLabel: 'Everyday care, used fully',\n      evenPremW: Math.round(prem / peak * 100) + '%',\n      evenPayW: Math.round(back / peak * 100) + '%',\n      /* The header figure counts every repeating benefit, hospital included; this\n         one counts only the everyday half. Two different quantities, so both have\n         to say which they are, unconditionally — not only when the benchmark\n         switch happens to be on. */\n      evenSplit: this.money(evPay) + ' paid as cash benefits, plus about ' + this.money(teleValue) + ' of telehealth at no charge — ' + teleVisits + ' visits a year at a typical ' + this.money(teleRate) + ' each. Hospital, ICU and surgery are counted in the ' + this.money(annual) + ' above, not here: a normal year does not include an admission.',\n      showLumps: lumps > 0,\n      lumpsFigure: this.money(lumps),\n      // how often an event benefit can be claimed is not settled in the matrix —\n      // say what is documented and nothing beyond it\n      lumpsBody: 'Paid on the event rather than a visit, straight into your account, with no receipts to file. It is an event benefit, not an annual one, so it sits outside the yearly figures above.',\n      /* Banded off the real ratio. Every shape currently lands above 1.15, and\n         understating that by a third throws away the one claim no ACA plan can\n         make — but \"used fully\" stays attached, because it is a cap and not a\n         forecast. */\n      evenSub: ratio >= 1.15\n        ? 'Used fully, this plan is worth ' + this.money(back - prem) + ' more than it costs — every cleaning, script and visit at the frequency your plan covers. And then there is everything without a line item.'\n        : (ratio >= 0.95\n          ? 'Near enough one for one on the money — every cleaning, script and visit at the frequency your plan covers. What the difference buys has no line item.'\n          : this.money(back) + ' of it comes back as care you use in an ordinary year, at the frequency your plan covers. The rest buys the hospital and cash cover above, and the things that never appear as a payout.'),\n      extras: extras,\n      showPlanBench: s.bench && evCost > 0,\n      planBenchAside: 'At typical prices that same everyday care bills about ' + this.money(evCost) + ' a year, so the plan meets ' + evPct + '% of it. Open any benefit to see it line by line.',\n      planBenchNote: 'Cost figures are typical billed national averages — directional estimates from KFF, AHA, AHRQ, ADA and comparable 2024–26 sources. What you are charged varies by provider and by state. Pending FAIR Health validation before client-facing use.',\n      planFoot: 'Maximum annual benefit counts every benefit that repeats each year, hospital and surgical included. The figures below it are the everyday half of that — the care a normal year actually uses.',\n      totalLabel: s.prices ? '$' + total.toFixed(2) : '—',\n      annualLabel: s.prices ? this.money(total * 12) + ' a year · age ' + s.age : 'Prices hidden',\n      cells: cells,\n      tiers: tiers,\n      lines: lines,\n      switches: switches,\n      personas: personas,\n      summary: count + ' of 10 turned on. Maximum annual benefit ' + this.money(annual) +\n        (lumps ? ', plus ' + this.money(lumps) + ' in lump-sum cover.' : '.'),\n      open: {\n        eyebrow: m.label,\n        isSpine: !!m.spine,\n        title: m.title,\n        desc: m.desc,\n        hasTiers: !m.free,\n        priceCaption: m.free ? 'Cost' : (active ? T[shownTier] + ' · per month' : 'If you added it'),\n        price: m.free ? 'Free' : (s.prices ? '$' + rate.toFixed(2) : T[shownTier]),\n        payback: modAnnual ? 'Maximum annual benefit ' + this.money(modAnnual) : '',\n        hasNote: !!m.note,\n        note: m.note || '',\n        canToggle: !m.always && !m.free,\n        showSplit: s.bench && s.detail > 0 && m.lines.filter(l => l.big).length > 0,\n        showBenchNote: s.bench && s.detail > 0 && m.lines.filter(l => l.retail).length > 0,\n        onBack: () => this.setState({ open: null }),\n        onToggle: () => this.toggleModule(m.key),\n        toggleLabel: active ? 'Leave this out' : 'Add this to my plan'\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
